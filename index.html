<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Islamjohn</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --card: #17181d;
    --card-hover: #1e2027;
    --border: #272932;
    --text: #ecedf1;
    --muted: #8a8d99;
    --steel: #aab4c8;
    --steel-dim: #5d6577;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(170,180,200,0.07), transparent 70%);
    pointer-events: none;
  }

  .container {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    padding: 56px 20px 40px;
  }

  /* Profile */
  .profile { text-align: center; padding-bottom: 36px; }

  .avatar-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 26px;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
  }

  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #aab4c8, #2a2d37 30%, #2a2d37 55%, #e6e9f0 75%, #aab4c8);
    animation: spin 5s linear infinite;
  }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--bg);
  }

  .avatar-glow {
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(170,180,200,0.22), transparent 65%);
    animation: breathe 4s ease-in-out infinite alternate;
  }

  .avatar {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid var(--bg);
    background: #ddd;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.94) contrast(1.04);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { from { opacity: 0.35; transform: scale(0.96); } to { opacity: 1; transform: scale(1.05); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }

  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--text);
    animation: rise 0.9s 0.1s cubic-bezier(.2,.7,.2,1) both;
  }

  .handle {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
    animation: rise 0.9s 0.2s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Contact list */
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: rise 0.9s 0.3s cubic-bezier(.2,.7,.2,1) both;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }

  .link:hover { background: var(--card-hover); border-color: var(--steel-dim); }
  .link:active { transform: scale(0.985); }
  .link:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }

  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--steel);
  }

  .text { flex: 1; min-width: 0; }

  .label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }

  .value {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chev {
    color: var(--steel-dim);
    font-size: 18px;
    line-height: 1;
    transition: transform 0.2s, color 0.2s;
  }

  .link:hover .chev { transform: translateX(3px); color: var(--steel); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
